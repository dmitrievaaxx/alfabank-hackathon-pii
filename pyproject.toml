[project]
name = "alfa-bank-pii-proxy"
version = "1.0.0"
description = "Прокси-чат с детекцией и маскированием ПДн перед отправкой в LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "accelerate>=0.27.0",
    "python-dotenv>=1.0.0",
]

# CPU-версия torch — значительно меньше размером чем CUDA (~200 МБ вместо ~2 ГБ)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
